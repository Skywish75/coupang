name = "coupang"
main = "worker/index.js"
compatibility_date = "2026-09-22"

[assets]
directory = "dist"
binding = "ASSETS"

[vars]
GITHUB_REPO = "Skywish75/coupang"
GITHUB_BRANCH = "main"

# 매일 00:00 UTC(=한국시간 09:00)에 자동 발행 1건 실행. cron 표현식은 필요에 맞게 조정.
[triggers]
crons = ["0 0 * * *"]

# Cloudflare 대시보드(Storage & Databases > KV)에서 네임스페이스를 만든 뒤
# 아래 id를 실제 값으로 교체하세요. (README의 설정 체크리스트 참고)
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
